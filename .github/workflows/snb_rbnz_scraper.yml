name: SNB RBNZ Scraper

on:
  schedule:
    # Toutes les 2 heures, decalage de 15 min par rapport a
    # rateprobability_scraper.yml pour eviter que les deux jobs tentent
    # un commit/push exactement en meme temps (pas obligatoire - la
    # logique retry+merge du commit gere deja les conflits - mais evite
    # des collisions inutiles).
    - cron: "15 */2 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Ecrire la cle de service Firebase
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > service_account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Lancer le script d'extraction
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
        run: python snb_rbnz_cloud.py

      - name: Commit et push docs/ (avec retry en cas de conflit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && exit 0
          git commit -m "Update SNB/RBNZ rate probabilities [skip ci]"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git merge -X ours origin/main --no-edit
            if git push; then
              echo "Push reussi (tentative $i)."
              exit 0
            fi
            echo "Push refuse (tentative $i), nouvel essai dans $((i*3))s..."
            sleep $((i*3))
          done

          echo "Echec du push apres plusieurs tentatives."
          exit 1

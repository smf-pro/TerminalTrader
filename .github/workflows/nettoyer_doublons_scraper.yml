name: Nettoyer doublons indicateurs (ponctuel)
on:
  workflow_dispatch: {}
jobs:
  nettoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Ecrire la cle de service Firebase
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > service_account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Lancer le nettoyage
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
        run: python nettoyer_doublons_indicateurs.py

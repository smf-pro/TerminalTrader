name: CB Scraper

on:
  schedule:
    # Toutes les 5 minutes (minimum pratique gratuit sur GitHub Actions)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Ecrire la cle de service Firebase
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > service_account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Lancer le script d'extraction
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
        run: python centralbanks_cloud.py

      - name: Commit et push docs/data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "Update data.json [skip ci]"
          git push

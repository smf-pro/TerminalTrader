name: Actifs Historique 1h

on:
  schedule:
    # Toutes les heures, a la minute 5 : la bougie horaire precedente est
    # alors terminee cote Yahoo. Pas besoin de cron-job.org ici : meme si
    # GitHub retarde un declenchement, chaque run retelecharge 14 jours et
    # l'ecriture est idempotente, donc aucune bougie n'est jamais perdue.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      jours_historique:
        description: "Jours d'historique a telecharger (14 = run normal, 700 = backfill complet du passe disponible)"
        required: false
        default: "14"

# Un seul run a la fois : le backfill (long) ne doit pas se chevaucher avec
# un run horaire. Les declenchements en attente ne sont pas annules.
concurrency:
  group: actifs-historique
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # large pour le backfill ; un run normal dure 1 a 3 minutes
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Ecrire la cle de service Firebase
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > service_account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Lancer le script d'historique des actifs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          JOURS_HISTORIQUE: ${{ github.event.inputs.jours_historique }}
        run: python actifs_cloud.py

      - name: Commit et push cache/ (avec retry en cas de conflit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/
          git diff --staged --quiet && exit 0
          git commit -m "Update actifs cache [skip ci]"

          # Plusieurs scrapers tournent en parallele (FF, CB, IL, fxforex...) :
          # un autre workflow peut pousser entre notre "merge" et notre
          # "push" : GitHub refuse alors le push (ref-lock). On reessaie
          # avec un nouveau fetch/merge a chaque tentative, au lieu
          # d'abandonner directement.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git merge -X ours origin/main --no-edit
            if git push; then
              echo "Push reussi (tentative $i)."
              exit 0
            fi
            echo "Push refuse (tentative $i), nouvel essai dans $((i*3))s..."
            sleep $((i*3))
          done

          echo "Echec du push apres plusieurs tentatives."
          exit 1
